name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel on the default branch: a cancelled run is not a failure, so two
  # merges landing close together could put a commit on main with no completed
  # CI and no red X.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # MUST come before setup-node: `cache: pnpm` below asks pnpm where its
      # store lives, so the binary has to exist first. No `version:` here on
      # purpose -- the action reads it from the `packageManager` field, which
      # keeps one source of truth for the pnpm version across CI, Vercel and
      # every developer machine.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Each step runs even if an earlier one failed, so a red run reports
      # every problem at once instead of one per push.
      - name: Lint
        if: '!cancelled()'
        run: pnpm lint

      - name: Typecheck
        if: '!cancelled()'
        run: pnpm typecheck

      - name: Unit tests
        if: '!cancelled()'
        run: pnpm test:ci

      - name: Production build
        if: '!cancelled()'
        run: pnpm build

      - name: Upload coverage
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # Vercel does not run pnpm/action-setup. As of 2026-09-11 its build-utils
  # still do not list pnpm 11 (vercel/vercel#17434, PR #17450 unmerged), so
  # lockfile 9.0 is detected as pnpm 9 or the install falls through to npm.
  # This job runs the same corepack bootstrap as vercel.json installCommand
  # on a stock Node image, which is the closest CI can get to that path.
  vercel-shaped:
    name: Vercel-shaped install and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Corepack-bootstrap pnpm 11 and install
        run: corepack enable && corepack prepare pnpm@11.24.0 --activate && pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm build
