name: Security Audit

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  # Weekly scan catches advisories disclosed against dependencies we already
  # have, which a PR-triggered run never would.
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  # Never cancel on the default branch: a cancelled run is not a failure, so two
  # merges landing close together could put a commit on main with no completed
  # CI and no red X.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # No install step. `pnpm audit` resolves the tree from pnpm-lock.yaml and
      # queries the advisory API directly, so it needs neither node_modules nor
      # a store. The old workflow ran a full `yarn install --immutable` first,
      # which also meant every dependency install script executed on a runner
      # whose only job was to read a lockfile.
      - name: Audit (critical) - blocking
        run: pnpm audit --audit-level critical

      - name: Audit (high) - informational
        if: '!cancelled()'
        run: pnpm audit --audit-level high || true

      - name: Open an issue if the scheduled scan fails
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Security: critical vulnerability in dependencies'
            const body = [
              'The scheduled audit found a **critical** advisory.',
              '',
              'Reproduce locally with `pnpm audit`.',
              '',
              `[View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n')

            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'security' }
            )
            if (!existing.some((i) => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'dependencies'],
              })
            }
